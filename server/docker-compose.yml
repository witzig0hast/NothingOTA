# Start:  docker compose -f server/docker-compose.yml up -d --build   (aus dem Repo-Verzeichnis)
services:
  cmfserver:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: cmfserver:latest
    container_name: cmfserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Berlin
      # MQTT-Broker, Home-Assistant-API und KI trägt der Admin (erstes Konto) auf der Website unter „Server“ ein.
      # Optional als Vorgabe per Umgebung, z. B.:
      # MQTT_HOST: 192.168.1.10
      # MQTT_USER: mqtt-user
      # MQTT_PASSWORD: mqtt-passwort
    volumes:
      - cmf-data:/data      # Datenbank (benanntes Volume, gehört automatisch dem Container-Benutzer)
      - ./import:/import:ro # hier abgelegte Dateien werden automatisch importiert (z.B. per Syncthing)

volumes:
  cmf-data:
