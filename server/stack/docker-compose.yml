# CMF Health: Website + API + Home-Assistant-Brücke (+ optional HTTPS mit Caddy, + optional eigener MQTT-Broker)
#
# 1. PUBLIC_URL auf deine Subdomain setzen (z. B. https://health.example.de)
# 2. docker compose up -d                    (eigener Reverse-Proxy vorhanden)
#    docker compose --profile https up -d    (Caddy holt automatisch ein HTTPS-Zertifikat)
# 3. https://<deine-subdomain> öffnen, Konto anlegen (das erste Konto wird Admin)
# 4. Als Admin unter „Server“ den MQTT-Broker von Home Assistant und den KI-Endpunkt (LiteLLM) eintragen.
#    CMF Health ist dabei nur Client – dein vorhandener Broker (z. B. Mosquitto-Add-on) bleibt, wie er ist.
#    Noch keinen Broker? `--profile broker` startet einen (Host in der Website dann: mosquitto).
services:
  cmfserver:
    image: ghcr.io/witzig0hast/cmfserver:latest
    container_name: cmfserver
    restart: unless-stopped
    ports:
      - "8080:8080"                 # mit Caddy-Profil nicht nötig, schadet aber nicht im Heimnetz
    environment:
      TZ: Europe/Berlin
      PUBLIC_URL: "https://health.example.de"   # deine Subdomain (für die Ein-Tipp-Verbindung der Apps)
      SIGNUP: first                 # first = nur das erste Konto registriert sich selbst, open = jeder darf
      COOKIE_SECURE: auto           # auto = Secure-Cookie, wenn der Proxy https meldet
      # MQTT, Home Assistant und KI stellt der Admin auf der Website ein (Seite „Server“).
      # Umgebungsvariablen wie MQTT_HOST / LLM_BASE_URL gehen weiterhin und gelten dann als Vorgabe.
    volumes:
      - cmf-data:/data
      - ./import:/import:ro         # optional: Gadgetbridge-Dateien (Unterordner = Benutzername)

  # Nur falls du noch keinen MQTT-Broker hast:  docker compose --profile broker up -d
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    profiles: [broker]
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  # HTTPS für die Subdomain (Ports 80/443 müssen auf diesen Rechner zeigen)
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    profiles: [https]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [cmfserver]

volumes:
  cmf-data:
  mosquitto-data:
  caddy-data:
