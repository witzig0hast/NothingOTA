name: Server (Docker)

on:
  push:
    paths: ["server/**", "cmfexport/**", "tests/**", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          pip install pytest -r server/requirements.txt
          python -m pytest -q
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/cmfserver
          TAG=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          docker build -f server/Dockerfile -t $IMAGE:$TAG -t $IMAGE:latest .
          docker push $IMAGE:$TAG
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then docker push $IMAGE:latest; fi
