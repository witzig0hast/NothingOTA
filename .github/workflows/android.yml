name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Test and build
        run: ./gradlew testReleaseUnitTest assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: CMF-Export-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CMF-Track-apk
          path: android/tracker/build/outputs/apk/release/tracker-release.apk
